name: Release Verification

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    uses: luluthehungrycat/omp-pi-sandbox-infra/.github/workflows/reusable-release-verification.yml@main
    with:
      plugin_repository: luluthehungrycat/omp-pi-sandbox-oddsjam
      package_name: '@luluthehungrycat/omp-pi-sandbox-oddsjam'
